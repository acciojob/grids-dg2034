<!DOCTYPE html>

<html>

<head>

<body>

<div class="container p-0"
     style="width: 600px; max-width: 100%; border: 5px solid rgb(4, 255, 4); background-color: rgb(41, 0, 0);">

    <!-- Row 1 -->
    <div class="row g-0"
         style="height: 200px; border: 5px solid rgb(255, 188, 188);">
        <div class="col-6 col-md-4"
             style="background-color: teal; border: 2px dotted rgb(38, 38, 43);">
            Column 1
        </div>

        <div class="col-6 col-md-8"
             style="background-color: thistle; border: 2px dotted rgb(38, 38, 43);">
            Column 2
        </div>

    <!-- Row 2 -->
    <div class="row g-0"
         style="height: 200px; border: 5px solid rgb(255, 188, 188);">
        <div class="col-md-4 offset-md-2"
             style="background-color: tomato; border: 2px dotted rgb(38, 38, 43);">
            Column 1
        </div>

        <div class="col-md-4"
             style="background-color: turquoise; border: 2px dotted rgb(38, 38, 43);">
            Column 2
        </div>

    <div class="row g-0 justify-content-center"
         style="height: 200px; border: 5px solid rgb(255, 188, 188);">
        <div class="col-6 col-md-4"
             style="background-color: violet; border: 2px dotted rgb(38, 38, 43);">
            Column 1
        </div>

        <div class="col-6 col-md-4"
             style="background-color: yellowgreen; border: 2px dotted rgb(38, 38, 43);">
